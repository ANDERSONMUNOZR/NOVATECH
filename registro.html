<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NOVATECH - Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="img/logo.png" alt="Logo" class="logo">
        <h1>NOVATECH</h1>
        <p>Venta de tecnologia</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="index.html#productos">Productos</a>
        <a href="index.html#servicios">Servicios</a>
        <a href="registro.html">Registro de clientes</a>
        <a href="index.html#contacto">Contacto</a>
    </nav>

    <main>
        <section>
            <h2>Registro de clientes</h2>
            <p>Ingresa tus datos.</p>
            <form action="#" method="get">
                <fieldset>
                    <legend>Datos personales</legend>
                    <label>Cedula:</label>
                    <input type="text" name="cedula" pattern="[0-9]{10}" minlength="10" maxlength="10" required>
                    <label>Nombres:</label>
                    <input type="text" name="nombres" minlength="2" maxlength="40" required>
                    <label>Apellidos:</label>
                    <input type="text" name="apellidos" minlength="2" maxlength="40" required>
                    <label>Fecha de nacimiento:</label>
                    <input type="date" name="fecha" required>
                    <label>Edad:</label>
                    <input type="number" name="edad" min="1" max="120" required>
                    <p>Genero:</p>
                    <label class="opcion"><input type="radio" name="genero" value="M" required> Masculino</label>
                    <label class="opcion"><input type="radio" name="genero" value="F"> Femenino</label>
                    <label class="opcion"><input type="radio" name="genero" value="O"> Otro</label>
                </fieldset>

                <fieldset>
                    <legend>Datos de contacto</legend>
                    <label>Correo:</label>
                    <input type="email" name="correo" required>
                    <label>Telefono:</label>
                    <input type="tel" name="telefono" pattern="[0-9]{10}" minlength="10" maxlength="10" required>
                    <label>Direccion:</label>
                    <input type="text" name="direccion" minlength="5" maxlength="100" required>
                    <label>Ciudad:</label>
                    <select name="ciudad" required>
                        <option value="">Selecciona</option>
                        <option>Guayaquil</option>
                        <option>Quito</option>
                        <option>Cuenca</option>
                        <option>Manta</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Preferencias</legend>
                    <p>Productos de interes:</p>
                    <label class="opcion"><input type="checkbox" name="productos" value="computadoras"> Computadoras</label>
                    <label class="opcion"><input type="checkbox" name="productos" value="impresoras"> Impresoras</label>
                    <label class="opcion"><input type="checkbox" name="productos" value="accesorios"> Accesorios</label>
                    <label class="opcion"><input type="checkbox" name="productos" value="celulares"> Celulares</label>
                    <p>Servicios de interes:</p>
                    <label class="opcion"><input type="checkbox" name="servicios" value="mantenimiento"> Mantenimiento</label>
                    <label class="opcion"><input type="checkbox" name="servicios" value="reparacion"> Reparacion</label>
                    <label class="opcion"><input type="checkbox" name="servicios" value="soporte"> Soporte tecnico</label>
                    <label>Foto (opcional):</label>
                    <input type="file" name="foto" accept="image/*">
                </fieldset>

                <fieldset>
                    <legend>Confirmacion</legend>
                    <label class="opcion"><input type="checkbox" name="terminos" required> Acepto los terminos y condiciones.</label>
                    <div class="botones">
                        <button type="submit">Registrar</button>
                        <button type="reset" class="limpiar">Limpiar</button>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>2026 NOVATECH. Derechos reservados.</p>
    </footer>
</body>
</html>
